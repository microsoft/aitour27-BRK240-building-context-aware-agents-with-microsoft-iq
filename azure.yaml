name: caldova-supply-autopilot

services:
  caldova-supply-autopilot:
    project: ./src/autopilot
    host: azure.ai.agent
    language: python
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_13
    kind: hosted
    name: caldova-supply-autopilot
    protocols:
      - protocol: responses
        version: 2.0.0
      - protocol: activity
        version: 1.0.0

hooks:
  postprovision:
    shell: pwsh
    run: ./infra/scripts/post-provision.ps1
    interactive: true
    continueOnError: false

